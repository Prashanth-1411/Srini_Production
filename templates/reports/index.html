{% extends "base.html" %}
{% block page_title %}Reports{% endblock %}
{% block content %}
<div class="row g-3">
  {% for r in reports %}
  <div class="col-md-6 col-xl-3">
    <a href="{% url r.url %}" class="text-decoration-none">
      <div class="card h-100">
        <div class="card-body">
          <div class="fw-semibold">{{ r.label }}</div>
          <p class="text-muted small mb-0">{{ r.desc }}</p>
        </div>
        <div class="card-footer bg-transparent"><i class="bi bi-bar-chart-line me-1"></i>Open report</div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
