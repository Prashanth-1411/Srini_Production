{% extends "base.html" %}
{% block page_title %}Grinding / Hard-facing{% endblock %}
{% block content %}
<div class="row g-3">
  {% for item in counts %}
  <div class="col-md-4">
    <a href="{% url item.url %}" class="text-decoration-none">
      <div class="card h-100">
        <div class="card-body d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi {{ item.icon }}"></i></div>
            <div>
              <div class="fw-semibold">{{ item.label }}</div>
              <div class="text-muted small">{{ item.count }} record{{ item.count|pluralize }}</div>
            </div>
          </div>
          <i class="bi bi-chevron-right text-muted"></i>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
