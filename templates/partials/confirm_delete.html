<div class="card">
  <div class="card-header fw-semibold">Confirm Delete</div>
  <div class="card-body text-center py-5">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:3.5rem;"></i>
    <h4 class="mt-3">Delete "{{ object }}"?</h4>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
      <a href="{{ back_url|default:'#' }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
